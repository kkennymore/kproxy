name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  msi:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build binaries
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          npm --prefix web ci
          npm --prefix web run build
          go run ./internal/buildtool -clean web/dist internal/server/dashboard
          go build -trimpath -ldflags "-s -w -X kproxy/internal/version.Version=$v -X kproxy/internal/version.Commit=$env:GITHUB_SHA" -o dist/kproxy.exe ./cmd/kproxy
          go build -trimpath -ldflags "-s -w -X kproxy/internal/version.Version=$v -X kproxy/internal/version.Commit=$env:GITHUB_SHA" -o dist/kproxyd.exe ./cmd/kproxyd

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSIs
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          & packaging\build-msi.ps1 -Version $v -KproxyExe dist\kproxy.exe -KproxydExe dist\kproxyd.exe -OutDir dist\msi

      - name: Upload MSIs to release
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" dist/msi/*.msi --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}