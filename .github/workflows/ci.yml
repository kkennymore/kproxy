name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/...

      - name: Dashboard build
        run: |
          npm --prefix web ci
          npm --prefix web run build
          go run ./internal/buildtool -clean web/dist internal/server/dashboard

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build installers (snapshot)
        run: goreleaser release --snapshot --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: artifacts

      - name: Extract and smoke-test (linux)
        if: runner.os == 'Linux'
        run: |
          tar -xzf artifacts/kproxy_*_linux_*.tar.gz -C .
          ./kproxy --version
          ./kproxyd --version

      - name: Extract and smoke-test (windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem artifacts\*.zip | ForEach-Object { Expand-Archive $_ -DestinationPath . -Force }
          .\kproxy.exe --version
          .\kproxyd.exe --version

      - name: Extract and smoke-test (macos)
        if: runner.os == 'macOS'
        run: |
          unzip artifacts/kproxy_*_darwin_*.zip -d .
          ./kproxy --version
          ./kproxyd --version
